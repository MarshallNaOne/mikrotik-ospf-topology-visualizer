name: Test and Build Standalone Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test CLI smoke command
        run: |
          python run.py --version
          python run.py --help

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  build:
    name: Build ${{ matrix.artifact_name }} (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ospf-viz-windows-x64
            bundle_type: exe
          - os: ubuntu-22.04
            artifact_name: ospf-viz-linux-x64
            bundle_type: bin
          - os: macos-15
            artifact_name: ospf-viz-macos-arm64
            bundle_type: macos
          - os: macos-15-intel
            artifact_name: ospf-viz-macos-x64
            bundle_type: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm ospf_viz.spec

      - name: Package Windows Binary
        if: matrix.bundle_type == 'exe'
        shell: bash
        run: |
          mkdir -p staging
          cp dist/ospf-viz.exe staging/ospf-viz.exe
          cd staging
          7z a ../${{ matrix.artifact_name }}.zip ospf-viz.exe
          cd ..

      - name: Package Linux Binary
        if: matrix.bundle_type == 'bin'
        run: |
          mkdir -p staging
          cp dist/ospf-viz staging/ospf-viz
          chmod +x staging/ospf-viz
          file staging/ospf-viz
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C staging ospf-viz

      - name: Verify Architecture and Package macOS App Bundle
        if: matrix.bundle_type == 'macos'
        run: |
          echo "System Architecture: $(uname -m)"
          if [ -d "dist/OSPF-Viz.app" ]; then
            file "dist/OSPF-Viz.app/Contents/MacOS/ospf-viz"
            ditto -c -k --sequesterRsrc --keepParent dist/OSPF-Viz.app ${{ matrix.artifact_name }}.zip
          else
            file dist/ospf-viz
            mkdir -p staging
            cp dist/ospf-viz staging/ospf-viz
            chmod +x staging/ospf-viz
            ditto -c -k --sequesterRsrc staging ${{ matrix.artifact_name }}.zip
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error
