name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ospf-viz-windows-x64
            bundle_type: exe
            archive_name: ospf-viz-windows-x64.zip
          - os: ubuntu-22.04
            artifact_name: ospf-viz-linux-x64
            bundle_type: bin
            archive_name: ospf-viz-linux-x64.tar.gz
          - os: macos-15
            artifact_name: ospf-viz-macos-arm64
            bundle_type: macos
            archive_name: ospf-viz-macos-arm64.zip
          - os: macos-15-intel
            artifact_name: ospf-viz-macos-x64
            bundle_type: macos
            archive_name: ospf-viz-macos-x64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm ospf_viz.spec

      - name: Package Windows Binary
        if: matrix.bundle_type == 'exe'
        shell: bash
        run: |
          mkdir -p staging
          cp dist/ospf-viz.exe staging/ospf-viz.exe
          cd staging
          7z a ../${{ matrix.archive_name }} ospf-viz.exe
          cd ..

      - name: Package Linux Binary
        if: matrix.bundle_type == 'bin'
        run: |
          mkdir -p staging
          cp dist/ospf-viz staging/ospf-viz
          chmod +x staging/ospf-viz
          tar -czvf ${{ matrix.archive_name }} -C staging ospf-viz

      - name: Package macOS App Bundle
        if: matrix.bundle_type == 'macos'
        run: |
          mkdir -p staging
          if [ -d "dist/OSPF-Viz.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/OSPF-Viz.app ${{ matrix.archive_name }}
          else
            cp dist/ospf-viz staging/ospf-viz
            chmod +x staging/ospf-viz
            ditto -c -k --sequesterRsrc staging ${{ matrix.archive_name }}
          fi

      - name: Upload Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
